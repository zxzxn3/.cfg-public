# hypridle — 空闲/自动锁屏
# 触发链：5min 降亮度 → 10min 锁屏(hyprlock) → 20min 关屏 → 60min 挂起(s2idle)
general {
    lock_cmd = pidof hyprlock || hyprlock       # 避免启动多个 hyprlock 实例
    before_sleep_cmd = loginctl lock-session    # 休眠前先锁屏
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # 唤醒时点亮屏幕，免按两次键
}

# 5 分钟：屏幕背光降到 15%（最大值 200，故 30 = 15%；不用 0 是为了 OLED 上仍能看清）
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30
    on-resume = brightnessctl -r
}

# 键盘 RGB 背光暂不参与空闲管理：OMEN Transcend 16 的 4 区 RGB 键盘在这台机器上
# 没有暴露任何接口（/sys/class/leds 里没有 kbd_backlight，也没有 omen-rgb-keyboard
# 模块），所以 brightnessctl 必然报 "Device 'rgb:kbd_backlight' not found."。
# 要接管需先装 AUR 的 omen-rgb-keyboard-dkms-git，其接口是
# /sys/devices/platform/omen-rgb-keyboard/rgb_zones/brightness（0-100，非 LED class，
# 因此不能用 brightnessctl -r 自动还原，得自己存/取）。

# 10 分钟：锁屏
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 20 分钟：关屏（Hyprland 0.56 起 dispatch 只吃 Lua 表达式）
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
}

# 60 分钟：挂起（本机走 s2idle，不是 S3）。
# 顺序必须排在关屏之后；锁屏这一环由上面的 10min listener 和 general:before_sleep_cmd
# 双重保证，所以这里只挂起、不重复锁。
# 注意：这会把「挂着编译/下载」的任务冻住 —— 长任务期间请在别处 inhibit
# （systemd-inhibit --what=sleep ...）或临时注释掉本段。
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
