background_opacity          0.85
cursor_trail                5
window_padding_width        25

cursor_blink_interval 1.0 ease-in-out

copy_on_select clipboard

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# 自定义 shader（都在 ~/.config/kitty/shaders/，说明见那边的 README.md）。
# 背景四选一：下面四行留一行生效，另外三行注释掉；顺序必须是
# ink-stroke → 背景 → layout-fade → window-fade（focus-pulse 随意）。
# shader-rev: 38
# ↑ 改 shaders/ 里的任何文件时顺手 +1：kitty 的 auto_reload_config 只监听这个文件。
custom_shaders ink-stroke layout-fade window-fade focus-pulse
# custom_shaders ink-stroke star-nest layout-fade window-fade focus-pulse
# custom_shaders ink-stroke cloud-bg  layout-fade window-fade focus-pulse
# custom_shaders ink-stroke magic-box layout-fade window-fade focus-pulse
# 光标移动一格就允许起拖尾，墨痕才会跟着打字出现（默认 2 会跳过单格移动）
cursor_trail_start_threshold 1
